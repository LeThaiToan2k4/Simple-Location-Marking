name: Build

on:
  push:
    branches: [main, 'Fabric-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: simplelocationmarking-fabric-1.21.11
          path: build/libs/simplelocationmarking-fabric-*.jar
          if-no-files-found: error
