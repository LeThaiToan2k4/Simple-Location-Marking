name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          build/libs/simplelocationmarking-fabric-1.21.11-1.0.0.jar
          --title "Simple Location Marking ${GITHUB_REF_NAME}"
          --generate-notes
